<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header>
    <a class="site-logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="{{ site.title }}">
    </a>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/people/' | relative_url }}">People</a>
      <a href="{{ '/projects/' | relative_url }}">Projects</a>
      <a href="{{ '/publications/' | relative_url }}">Publications</a>
      <a href="{{ '/news/' | relative_url }}">News</a>
    </nav>
  </header>
  <main>
    <h1>{{ page.title }}</h1>
    {{ content }}
  </main>
  <footer>
    <div class="footer-inner">
      <div>
        <strong>{{ site.title }}</strong><br>
        {{ site.affiliation }}
      </div>
      <div>
        Research group lead:<br>
        <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a>
      </div>
    </div>
  </footer>
</body>
</html>
